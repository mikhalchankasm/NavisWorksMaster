name: CI

on:
  push:
  pull_request:

jobs:
  mcp:
    name: MCP build and tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Check NavisHelper Compile entries and plugin IDs
        run: python scripts/check_navishelper_compile.py

      - name: Check MCP command catalog
        run: python scripts/check_mcp_command_catalog.py

      - name: Check MCP tool capabilities
        run: python scripts/check_mcp_tool_capabilities.py --check

      - name: Check typed host command router
        run: python scripts/check_host_command_router.py

      - name: Check panel localization
        run: python scripts/check_panel_localization.py

      - name: Check agent instruction surface
        run: python scripts/check_agent_docs.py

      - name: Check truncation flags are documented
        run: python scripts/check_truncation_flags_documented.py

      - name: Check the product version is declared consistently
        run: python scripts/check_version_consistency.py

      - name: Self-test the version consistency guard
        run: python scripts/check_version_consistency.py --selftest

      - name: Check the list of files over 80 KB in AGENTS.md
        run: python scripts/check_source_sizes.py

      - name: Self-test the source-size guard
        run: python scripts/check_source_sizes.py --selftest

      - name: Check the latency baseline's coverage arithmetic
        run: python scripts/check_baseline_coverage.py

      - name: Self-test the baseline coverage guard
        run: python scripts/check_baseline_coverage.py --selftest

      - name: Build contracts
        run: dotnet build NavisHelper.Contracts/NavisHelper.Contracts.csproj -c Release

      - name: Build MCP server
        run: dotnet build NavisHelper.McpServer/NavisHelper.McpServer.csproj -c Release

      - name: Build MCP configurator
        run: dotnet build NavisHelper.McpConfigurator/NavisHelper.McpConfigurator.csproj -c Release

      - name: Smoke test scenario-library MCP lifecycle
        run: python scripts/navishelper_scenario_library_smoke.py

      - name: Run MCP helper tests
        shell: pwsh
        run: |
          $testResultsRoot = Join-Path $env:RUNNER_TEMP 'navishelper-test-results'
          dotnet test NavisHelper.McpServer.Tests/NavisHelper.McpServer.Tests.csproj -c Release --logger "trx;LogFileName=mcp-tests.trx" --results-directory $testResultsRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [xml]$testResults = Get-Content -LiteralPath (Join-Path $testResultsRoot 'mcp-tests.trx') -Raw -ErrorAction Stop
          $executed = [int]$testResults.TestRun.ResultSummary.Counters.executed
          if ($executed -le 0) { throw 'The MCP helper test run executed no tests.' }
          Write-Host "Verified MCP helper test execution: $executed tests."

      # The machine check itself cannot run here -- a runner has no installed bundle --
      # but its logic can: --selftest drives every branch against temp directories.
      - name: Self-test the installed-bundle drift guard
        run: python scripts/check_installed_bundle_drift.py --selftest

      # Fixture-only: no provider CLI is started, no network, no credential.
      - name: Test the external executor launcher
        run: >-
          python -m unittest
          scripts.tests.test_executor_process_control
          scripts.tests.test_external_worktree_executor
          scripts.tests.test_executor_worktree
          scripts.tests.test_agent_home_isolation
          scripts.tests.test_executor_host_guard
          scripts.tests.test_executor_msbuild_nodes
          scripts.tests.test_executor_event_journal
          scripts.tests.test_executor_escape_guard
          scripts.tests.test_build_mcpb
          scripts.tests.test_cleanup_merged_work
          scripts.tests.test_build_lock

      # Fixture-only: no Codex, no network, no credential. It guards the write-back
      # that carries a rotated Codex token out of the reviewer's disposable home,
      # whose failure mode is the operator being logged out on their next run.
      - name: Check the Codex reviewer's credential write-back
        shell: pwsh
        run: ./scripts/review/tests/check_codex_review_writeback.ps1

      # #292: -Base origin/main and -Base <SHA> threw in Windows PowerShell 5.1.
      # Fixture-only, against a throwaway repository; run under both shells.
      - name: Check the Codex reviewer's base resolution (Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/review/tests/check_codex_review_base.ps1

      - name: Check the Codex reviewer's base resolution (PowerShell 7)
        shell: pwsh
        run: ./scripts/review/tests/check_codex_review_base.ps1

      - name: Publish OpenRouter AI worker for distribution smoke
        shell: powershell
        run: |
          dotnet publish NavisHelper.AiWorker/NavisHelper.AiWorker.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -o NavisHelper.bundle/Contents/AiWorker `
            /p:DebugType=None `
            /p:DebugSymbols=false

      - name: Smoke test final distribution ZIP installer
        shell: powershell
        run: |
          $bundleRoot = "NavisHelper.bundle\Contents"
          foreach ($year in @("2024", "2025", "2026", "2027")) {
            $destination = Join-Path $bundleRoot $year
            New-Item -ItemType Directory -Force -Path $destination | Out-Null
            New-Item -ItemType File -Force -Path (Join-Path $destination "NavisHelper.dll") | Out-Null
            New-Item -ItemType File -Force -Path (Join-Path $destination "NavisHelper.Contracts.dll") | Out-Null
            $russianDestination = Join-Path $destination "ru"
            New-Item -ItemType Directory -Force -Path $russianDestination | Out-Null
            New-Item -ItemType File -Force -Path (Join-Path $russianDestination "NavisHelper.resources.dll") | Out-Null
          }
          $matrixFiles = @{}
          foreach ($year in 2024,2025,2026,2027) {
            foreach ($file in @('NavisHelper.dll','NavisHelper.Contracts.dll','ru/NavisHelper.resources.dll')) {
              $path = "NavisHelper.bundle/Contents/$year/$file"
              $matrixFiles[$path] = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
            }
          }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          @{source_commit=(git rev-parse HEAD);files=$matrixFiles;fixture=$true} | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath artifacts/plugin-matrix.json -Encoding UTF8
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\package_distribution.ps1 -SkipBuild -Runtime win-x64 -OutputRoot "$env:RUNNER_TEMP\navishelper-package-smoke" -PackageName ci-package-smoke

      - name: Check distribution deletion boundaries
        shell: powershell
        run: ./scripts/test_distribution_safety.ps1

      # Pinned: [Code] needs ExecAndCaptureOutput (Inno Setup 6.3+).
      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup --version=6.7.1 -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Reuses the fixture plugin matrix from the ZIP smoke above. Compiles the release
      # installer, then scripts/test_installer_upgrade.ps1 installs, upgrades over a legacy
      # McpServer directory and uninstalls a smoke build inside a temp root.
      - name: Compile the installer and prove install, upgrade and uninstall
        timeout-minutes: 30
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\build_installer.ps1 -SkipBuild -PackageName ci-package-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The Navisworks plugin build matrix is intentionally not run in GitHub Actions:
      # it requires the Autodesk Navisworks Manage SDK installed under Program Files.
