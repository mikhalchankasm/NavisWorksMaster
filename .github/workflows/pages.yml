name: Pages

# Publishes the landing page in site/ to GitHub Pages. The banner lives once, in docs/assets,
# and is copied into the site at build time.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/assets/banner-*.svg"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy the banner into the site
        run: cp docs/assets/banner-light.svg docs/assets/banner-dark.svg site/assets/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
